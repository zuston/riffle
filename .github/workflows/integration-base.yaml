name: Integration Base Image

on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/integration-base.yaml"
      - "dev/integration/Dockerfile.base"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: integration-base-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish integration base image
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - name: Resolve image references
        id: image
        shell: bash
        env:
          DOCKERFILE: dev/integration/Dockerfile.base
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          dockerfile_hash="$(sha256sum "$DOCKERFILE" | awk '{print $1}')"
          {
            echo "tags<<EOF"
            echo "ghcr.io/$owner/riffle-integration-base:integration-amd64-$dockerfile_hash"
            echo "ghcr.io/$owner/riffle-integration-base:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish integration base image
        uses: docker/build-push-action@v7
        with:
          context: dev/integration
          file: dev/integration/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=integration-base
          cache-to: type=gha,mode=max,scope=integration-base
