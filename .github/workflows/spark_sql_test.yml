name: Spark SQL Integration Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spark-sql-integration-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare integration base image
        id: integration-base
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          dockerfile_hash="$(sha256sum dev/integration/Dockerfile.base | awk '{print $1}')"
          image="ghcr.io/$owner/riffle-integration-base:integration-amd64-$dockerfile_hash"
          if ! docker pull "$image"; then
            echo "::warning::Integration base image is unavailable; building it locally."
            docker build --file dev/integration/Dockerfile.base --tag "$image" dev/integration
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # - name: ssh to debug 
        # uses: valeriangalliat/action-sshd-cloudflared@v4

      - name: Run Spark SQL Test
        run: |
          docker compose \
            -f dev/integration/docker-compose.yml \
            --profile test \
            up \
            --abort-on-container-exit \
            --exit-code-from riffle-test \
            riffle-test
        env:
          RIFFLE_INTEGRATION_BASE_IMAGE: ${{ steps.integration-base.outputs.image }}
