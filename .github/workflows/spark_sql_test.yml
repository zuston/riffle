name: Spark SQL Integration Test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spark-sql-integration-test:
    name: Spark SQL Integration Test (${{ matrix.coordinator_name }} coordinator)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - coordinator_name: Uniffle
            coordinator_host: uniffle-coordinator
            coordinator_type: uniffle
            coordinator_service: uniffle-coordinator
            profile: test
            test_service: riffle-test
          - coordinator_name: Riffle
            coordinator_host: riffle-coordinator
            coordinator_type: riffle
            coordinator_service: riffle-coordinator
            profile: riffle-coordinator
            test_service: riffle-test-riffle-coordinator
    env:
      COORDINATOR_HOST: ${{ matrix.coordinator_host }}
      COORDINATOR_TYPE: ${{ matrix.coordinator_type }}

    steps:
      - name: Remove unnecessary files
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare integration base image
        id: integration-base
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          dockerfile_hash="$(sha256sum dev/integration/Dockerfile.base | awk '{print $1}')"
          image="ghcr.io/$owner/riffle-integration-base:integration-amd64-$dockerfile_hash"
          if ! docker pull "$image"; then
            echo "::warning::Integration base image is unavailable; building it locally."
            docker build --file dev/integration/Dockerfile.base --tag "$image" dev/integration
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # - name: ssh to debug 
        # uses: valeriangalliat/action-sshd-cloudflared@v4

      - name: Run Spark SQL Test
        run: |
          docker compose \
            -f dev/integration/docker-compose.yml \
            --profile ${{ matrix.profile }} \
            up \
            --abort-on-container-exit \
            --exit-code-from ${{ matrix.test_service }} \
            ${{ matrix.test_service }}
        env:
          RIFFLE_INTEGRATION_BASE_IMAGE: ${{ steps.integration-base.outputs.image }}

      - name: Dump integration service logs
        if: ${{ failure() }}
        continue-on-error: true
        run: |
          docker compose \
            -f dev/integration/docker-compose.yml \
            --profile ${{ matrix.profile }} \
            ps
          docker compose \
            -f dev/integration/docker-compose.yml \
            --profile ${{ matrix.profile }} \
            logs \
            --no-color \
            --timestamps \
            --tail=200 \
            ${{ matrix.coordinator_service }} riffle-server-1 riffle-server-2 ${{ matrix.test_service }}
